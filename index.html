<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="端末の傾きとタッチで、有機的な粒子の流れに触れるプライバシーフレンドリーなWebアート。">
  <meta name="theme-color" content="#02080b">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="application-name" content="Flow Phenomenon">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">

  <title>Flow Phenomenon — Organic</title>
  <link rel="canonical" href="https://fenom6.github.io/flow-phenomenon/">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./vendor/p5.min.js"></script>
  <script defer src="./flow-core.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main id="canvas-host" aria-label="有機的に流れる粒子のインタラクティブアート"></main>

  <section id="intro" class="ui intro" data-ui aria-labelledby="intro-title">
    <div class="intro__card">
      <p class="eyebrow">FLOW PHENOMENON / ORGANIC</p>
      <h1 id="intro-title">流れに、触れる。</h1>
      <p class="intro__lead">端末を傾け、指でかき混ぜる。粒子はその場で反応し、センサーデータは端末の外へ送りません。</p>
      <button id="start-btn" class="start-button" type="button" disabled>
        <span id="start-label">読み込み中…</span>
        <span class="start-button__sub" aria-hidden="true">INITIALIZE FLOW</span>
      </button>
      <p id="start-status" class="intro__status" role="status" aria-live="polite">描画を準備しています。</p>
      <p class="intro__privacy">センサーを許可しなくても、タッチ／マウスモードで体験できます。</p>
    </div>
  </section>

  <div id="hud" class="ui hud is-hidden" data-ui aria-label="体験の状態とヘルプ">
    <button id="mode-btn" class="hud-button mode-button" type="button" aria-label="センサーの状態を確認">
      <span id="mode-dot" class="mode-dot" aria-hidden="true"></span>
      <span id="mode-label">TOUCH MODE</span>
    </button>
    <button id="help-btn" class="hud-button" type="button" aria-label="操作方法を表示" aria-controls="hint" aria-expanded="false">操作</button>
  </div>

  <div id="hint" class="ui hint" data-ui hidden aria-hidden="true">
    <strong>傾ける／ドラッグ</strong> 流れを動かす
    <span aria-hidden="true"> · </span>
    <strong>ダブルタップ</strong> 色を変える
    <span aria-hidden="true"> · </span>
    <strong>シェイク</strong> 粒子を爆ぜさせる
  </div>

  <nav id="controls" class="ui controls is-hidden" data-ui aria-label="Flow Phenomenon 操作">
    <button id="palette-btn" class="control-button" type="button">
      <span class="control-button__key">COLOR</span>
      <span id="palette-name">深海</span>
    </button>
    <button id="burst-btn" class="control-button" type="button">
      <span class="control-button__key">BURST</span>
      <span>爆ぜる</span>
    </button>
    <button id="pause-btn" class="control-button" type="button" aria-pressed="false">
      <span class="control-button__key">FLOW</span>
      <span id="pause-label">一時停止</span>
    </button>
  </nav>

  <p id="announcer" class="sr-only" role="status" aria-live="polite"></p>

  <noscript>
    <div class="noscript-message">この作品を表示するにはJavaScriptを有効にしてください。</div>
  </noscript>
</body>
</html>
