<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flow Phenomenon - Organic</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background-color: #000; touch-action: none; }
    #start-btn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 15px 30px; font-size: 16px; color: cyan; border: 1px solid cyan;
      background: rgba(0,0,0,0.8); cursor: pointer; z-index: 100;
      font-family: sans-serif; letter-spacing: 2px;
      transition: opacity 0.8s;
    }
    #hint {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: rgba(180, 230, 255, 0.7); font-family: sans-serif; font-size: 12px;
      letter-spacing: 1px; z-index: 90; text-align: center; line-height: 1.8;
      pointer-events: none; opacity: 0; transition: opacity 1.5s; white-space: nowrap;
      text-shadow: 0 0 8px rgba(0, 200, 255, 0.5);
    }
  </style>
</head>
<body>

<div id="start-btn">INITIALIZE ORGANIC FLOW</div>
<div id="hint">タッチ／ドラッグ：流れを乱す　・　ダブルタップ：色相を変える<br>シェイク：粒子を爆ぜさせる　・　傾き：重力になる</div>

<script>
let particles = [];
let numParticles = 800;      // 適応制御で増減する（adaptPerformance 参照）
const minParticles = 300;
const maxParticles = 1400;
let noiseScale = 0.005;      // ノイズの「細かさ」。小さいほど大きなうねりになる
let timeOffset = 0;          // 時間経過による変化用
let isSensorActive = false;
let started = false;

// --- カラーパレット（HSB）---
// 各パレットは「基準色相」と「色相の広がり」を持つ。
// 粒子は自分の進行方向に応じてこの範囲内の色相をまとう。
const palettes = [
  { name: '深海',     baseHue: 195, hueRange: 50,  sat: 80, bri: 100 }, // 青緑（オリジナルの継承）
  { name: 'オーロラ', baseHue: 120, hueRange: 140, sat: 75, bri: 95  }, // 緑〜紫
  { name: '焔',       baseHue: 10,  hueRange: 40,  sat: 90, bri: 100 }, // 赤〜橙
  { name: '月光',     baseHue: 220, hueRange: 25,  sat: 25, bri: 100 }, // 白銀
];
let paletteIndex = 0;
let paletteBlend = 1;        // パレット切替時のフェード（0→1）

// --- シェイク検出用 ---
let lastAccel = null;
let burstEnergy = 0;         // バースト直後の余韻（背景の明滅に使う）

// --- ダブルタップ検出用 ---
let lastTapTime = 0;

function setup() {
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);
  blendMode(ADD); // 加算合成で発光表現

  for (let i = 0; i < numParticles; i++) {
    particles.push(new Particle());
  }

  const btn = select('#start-btn');
  btn.mousePressed(startSensors);
}

function startSensors() {
  started = true;

  // iOS 13+ はセンサー利用に明示的な許可が必要
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(response => {
        if (response === 'granted') isSensorActive = true;
      })
      .catch(() => {});
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission().catch(() => {});
    }
  } else {
    isSensorActive = true;
  }

  // シェイク検出（加速度の急変を拾う）
  window.addEventListener('devicemotion', onDeviceMotion);

  select('#start-btn').hide();

  // 操作ヒントを数秒だけ見せてからフェードアウト
  const hint = document.getElementById('hint');
  hint.style.opacity = 1;
  setTimeout(() => { hint.style.opacity = 0; }, 6000);
}

function onDeviceMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x === null) return;
  if (lastAccel) {
    const delta = abs(a.x - lastAccel.x) + abs(a.y - lastAccel.y) + abs(a.z - lastAccel.z);
    if (delta > 25) burst(); // 強く振ると爆ぜる
  }
  lastAccel = { x: a.x, y: a.y, z: a.z };
}

// 全粒子を画面中心から外向きに弾き飛ばす
function burst() {
  if (burstEnergy > 0.5) return; // 連続発火を抑制
  burstEnergy = 1;
  for (let p of particles) {
    const dir = createVector(p.pos.x - width / 2, p.pos.y - height / 2);
    dir.setMag(random(8, 16));
    p.vel.add(dir);
    p.prev.set(p.pos); // 軌跡が飛ばないようリセット
  }
}

function draw() {
  blendMode(BLEND);
  // バースト直後はわずかに明滅させる
  background(0, 0, burstEnergy * 12, 15);
  blendMode(ADD);

  burstEnergy = max(0, burstEnergy - 0.03);
  paletteBlend = min(1, paletteBlend + 0.02);

  // --- 1. センサー重力の計算 ---
  let gx = 0;
  let gy = 0;
  if (isSensorActive && (rotationX !== 0 || rotationY !== 0)) {
    gx = rotationY * 0.05; // 傾きの影響力
    gy = rotationX * 0.05;
  } else if (!('ontouchstart' in window)) {
    // デスクトップ：マウス位置へゆるく引かれる
    gx = (mouseX - width / 2) * 0.002;
    gy = (mouseY - height / 2) * 0.002;
  }

  // --- 2. 時間経過で「場」を少しずつ変化させる ---
  timeOffset += 0.005;

  // 全粒子更新
  for (let p of particles) {
    p.followField(noiseScale, timeOffset); // ノイズの「風」を受ける
    p.applyForce(gx, gy);                  // センサーの「重力」を受ける
    p.repelFromPointer();                  // タッチ／クリック地点から逃げる
    p.update();
    p.show();
    p.edges();
  }

  adaptPerformance();
}

// フレームレートに応じて粒子数を自動調整する
function adaptPerformance() {
  if (frameCount % 60 !== 0) return;
  const fps = frameRate();
  if (fps < 45 && particles.length > minParticles) {
    particles.splice(0, 60); // 重ければ減らす
  } else if (fps > 55 && particles.length < maxParticles) {
    for (let i = 0; i < 30; i++) particles.push(new Particle());
  }
}

function cyclePalette() {
  paletteIndex = (paletteIndex + 1) % palettes.length;
  paletteBlend = 0; // フェードインさせる
}

// ダブルタップでパレット切替
function touchStarted() {
  if (!started) return;
  const now = millis();
  if (now - lastTapTime < 300) cyclePalette();
  lastTapTime = now;
}

// デスクトップ：ダブルクリックでも切替
function doubleClicked() {
  if (started) cyclePalette();
}

// デスクトップ：スペースでバースト、数字キーでパレット直接指定
function keyPressed() {
  if (key === ' ') burst();
  const n = parseInt(key);
  if (n >= 1 && n <= palettes.length) {
    paletteIndex = n - 1;
    paletteBlend = 0;
  }
}

class Particle {
  constructor() {
    this.pos = createVector(random(width), random(height));
    this.prev = this.pos.copy(); // 軌跡ライン用の前フレーム位置
    this.vel = createVector(0, 0);
    this.acc = createVector(0, 0);
    this.maxSpeed = random(2, 4);
    this.hueOffset = random(-1, 1); // パレット内での個体差
    this.size = random(1, 3);
  }

  // パーリンノイズによる「見えない流れ」に従う
  followField(scale, time) {
    // 画面上の位置(x,y)と時間(time)から、特定の「角度」を算出
    // これにより、場所によって風向きが違う「場」が生まれる
    let angle = noise(this.pos.x * scale, this.pos.y * scale, time) * TWO_PI * 2;

    // その角度へ向かう力を作る
    let force = p5.Vector.fromAngle(angle);
    force.mult(0.5); // 風の強さ
    this.applyForce(force.x, force.y);
  }

  applyForce(x, y) {
    this.acc.add(x, y);
  }

  // タッチ／マウス押下地点から逃げる
  repelFromPointer() {
    let px = null, py = null;
    if (touches.length > 0) {
      px = touches[0].x;
      py = touches[0].y;
    } else if (mouseIsPressed) {
      px = mouseX;
      py = mouseY;
    }
    if (px === null) return;

    let d = dist(this.pos.x, this.pos.y, px, py);
    if (d < 150) {
      let push = createVector(this.pos.x - px, this.pos.y - py);
      push.normalize();
      push.mult(map(d, 0, 150, 3.0, 0.5)); // 近いほど強い反発
      this.acc.add(push);
    }
  }

  update() {
    this.prev.set(this.pos);
    this.vel.add(this.acc);
    this.vel.limit(this.maxSpeed);
    this.pos.add(this.vel);
    this.acc.mult(0);
  }

  show() {
    const pal = palettes[paletteIndex];
    // 進行方向を色相にマッピングし、流れの向きが色の濃淡として見えるようにする
    const heading = this.vel.heading(); // -PI 〜 PI
    let hue = pal.baseHue + (heading / PI) * pal.hueRange * 0.5 + this.hueOffset * 15;
    hue = (hue + 360) % 360;

    // 速いほど明るく、パレット切替直後はフェードイン
    const speedRatio = this.vel.mag() / this.maxSpeed;
    const alpha = (30 + speedRatio * 50) * paletteBlend;

    stroke(hue, pal.sat, pal.bri, alpha);
    strokeWeight(this.size);
    line(this.prev.x, this.prev.y, this.pos.x, this.pos.y); // 点ではなく軌跡ラインで描く
  }

  // 画面端の処理：反対側からワープさせる
  edges() {
    let warped = false;
    if (this.pos.x > width)  { this.pos.x = 0;      warped = true; }
    if (this.pos.x < 0)      { this.pos.x = width;  warped = true; }
    if (this.pos.y > height) { this.pos.y = 0;      warped = true; }
    if (this.pos.y < 0)      { this.pos.y = height; warped = true; }
    if (warped) this.prev.set(this.pos); // ワープ時に画面を横切る線が出ないように
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>
</body>
</html>
